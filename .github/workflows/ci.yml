name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------------------
  # Frontend checks
  # ----------------------------------------------------------------
  frontend:
    name: Frontend — TypeScript + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.onrender.com/api/v1

  # ----------------------------------------------------------------
  # Backend checks
  # ----------------------------------------------------------------
  backend:
    name: Backend — TypeScript + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test?schema=public
          JWT_SECRET: test-secret-at-least-32-characters-long
          MOCK_AI: 'true'
          AI_SERVICE_URL: http://localhost:8000

  # ----------------------------------------------------------------
  # Python AI service tests
  # ----------------------------------------------------------------
  ai-service:
    name: AI Service — Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          MOCK_AI: 'true'

  # ----------------------------------------------------------------
  # Docker build validation
  # ----------------------------------------------------------------
  docker-build:
    name: Docker — Build validation
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai-service]

    steps:
      - uses: actions/checkout@v4

      - name: Build combined Docker image
        run: docker build -t ai-knowledge-assistant:ci .
        timeout-minutes: 15
